[project]
name = "f1-pipeline"
version = "0.1.0"
description = "a production-style AWS batch data pipeline for F1 data: Lambda, S3, Glue, Athena, Redshift Serverless, and Step Functions!"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Anirudh Konidala" }]

# No runtime dependencies: Lambda provides boto3, and the extractor uses only the standard library.
dependencies = []

[dependency-groups]
dev = [
  "boto3>=1.40",
  "duckdb>=1.4",
  "moto[s3]>=5.1",
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "glue", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true
